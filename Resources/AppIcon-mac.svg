<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e1e2e"/>
      <stop offset="100%" stop-color="#11111b"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff8fa3"/>
      <stop offset="100%" stop-color="#ff5c7a"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Full square background (macOS applies the squircle mask) -->
  <rect x="0" y="0" width="1024" height="1024" fill="url(#bg)"/>

  <!-- Sound wave bars (left side) -->
  <g filter="url(#glow)">
    <rect x="224" y="448" width="56" height="128" rx="28" fill="url(#wave)"/>
    <rect x="312" y="392" width="56" height="240" rx="28" fill="url(#wave)"/>
    <rect x="400" y="348" width="56" height="328" rx="28" fill="url(#wave)"/>
    <rect x="488" y="412" width="56" height="200" rx="28" fill="url(#wave)"/>
  </g>

  <!-- Text lines (right side) -->
  <rect x="600" y="412" width="200" height="40" rx="20" fill="#a6adc8" opacity="0.9"/>
  <rect x="600" y="496" width="160" height="40" rx="20" fill="#a6adc8" opacity="0.7"/>
  <rect x="600" y="580" width="180" height="40" rx="20" fill="#a6adc8" opacity="0.5"/>
</svg>
