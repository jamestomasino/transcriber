name: Release

# Builds, signs with Developer ID, notarizes, staples, and publishes a
# downloadable .zip. Runbook + secret list: docs/DISTRIBUTION.md §5.
#
# Requires these secrets in the protected release environment:
#   TRANSCRIBER_SIGN_IDENTITY   "Developer ID Application: Name (TEAMID)"
#   TRANSCRIBER_P12_BASE64      base64 of the exported .p12 (no newlines)
#   TRANSCRIBER_P12_PASSWORD    the .p12 export password
#   TRANSCRIBER_ASC_KEY_ID      App Store Connect API key ID
#   TRANSCRIBER_ASC_ISSUER      App Store Connect Issuer ID
#   TRANSCRIBER_ASC_KEY         raw contents of the .p8 key file
on:
  push:
    tags: [ "v*" ]          # e.g. v0.1.0
  workflow_dispatch: {}     # manual run from the Actions tab

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  validate-release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      commit: ${{ steps.validate.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1; Node 24
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release ref and main ancestry
        id: validate
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          case "$RELEASE_REF" in
            refs/heads/main|refs/tags/v*) ;;
            *) echo "Releases require main or a v-prefixed tag" >&2; exit 1 ;;
          esac
          git merge-base --is-ancestor HEAD refs/remotes/origin/main
          printf 'commit=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build-sign-notarize:
    needs: validate-release
    environment: release
    runs-on: macos-15       # needs CLT + notarytool
    timeout-minutes: 60
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    env:
      TRANSCRIBER_BUNDLE_ID: ${{ vars.TRANSCRIBER_BUNDLE_ID || 'local.transcriber' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1; Node 24
        with:
          ref: ${{ needs.validate-release.outputs.commit }}
          persist-credentials: false

      - name: Build + run test suite
        run: bash build.sh test

      - name: Import Developer ID certificate
        env:
          P12_BASE64: ${{ secrets.TRANSCRIBER_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.TRANSCRIBER_P12_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077

          CERT_PATH="$RUNNER_TEMP/transcriber-signing.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 32)"
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          trap 'rm -f "$CERT_PATH"' EXIT

          printf '%s' "$P12_BASE64" | base64 --decode > "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$CERT_PATH" \
            -P "$P12_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"

          security set-key-partition-list \
            -S apple-tool:,apple: -s \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Sign (hardened runtime) + notarize + staple
        # build.sh reads the identity + notarization creds from the environment
        # and does the sign → notarize → staple steps itself (see its sign_app /
        # notarize_app functions). We just write the API key to a file first.
        env:
          TRANSCRIBER_SIGN_IDENTITY: ${{ secrets.TRANSCRIBER_SIGN_IDENTITY }}
          TRANSCRIBER_NOTARIZE: "1"
          TRANSCRIBER_ASC_KEY_ID: ${{ secrets.TRANSCRIBER_ASC_KEY_ID }}
          TRANSCRIBER_ASC_ISSUER: ${{ secrets.TRANSCRIBER_ASC_ISSUER }}
          TRANSCRIBER_ASC_KEY: ${{ secrets.TRANSCRIBER_ASC_KEY }}
        run: |
          set -euo pipefail
          umask 077
          KEY_DIR="$RUNNER_TEMP/transcriber-notarization"
          mkdir -m 700 "$KEY_DIR"
          trap 'rm -rf "$KEY_DIR"' EXIT
          KEY_PATH="$KEY_DIR/AuthKey.p8"
          printf '%s' "$TRANSCRIBER_ASC_KEY" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          export TRANSCRIBER_ASC_KEY_PATH="$KEY_PATH"
          bash build.sh

      - name: Verify signature + staple
        run: |
          set -euo pipefail
          codesign --verify --deep --strict --verbose=2 build/Transcriber.app
          codesign --display --verbose=4 build/Transcriber.app
          spctl --assess --type execute --verbose=4 build/Transcriber.app
          xcrun stapler validate build/Transcriber.app

      - name: Remove signing credentials before packaging and upload
        run: |
          set -euo pipefail
          rm -f "$RUNNER_TEMP/transcriber-signing.p12"
          rm -rf "$RUNNER_TEMP/transcriber-notarization"

          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          if [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH"
          fi

      - name: Package .zip
        run: ditto -c -k --keepParent build/Transcriber.app build/Transcriber.zip

      - name: Upload signed app artifact
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2; Node 24
        with:
          name: Transcriber-macOS
          path: build/Transcriber.zip
          if-no-files-found: error
          retention-days: 14

      - name: Clean up signing credentials
        if: ${{ always() }}
        run: |
          set -euo pipefail
          cleanup_status=0
          rm -f "$RUNNER_TEMP/transcriber-signing.p12" || cleanup_status=$?
          rm -rf "$RUNNER_TEMP/transcriber-notarization" || cleanup_status=$?

          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          if [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH" || cleanup_status=$?
          fi
          exit "$cleanup_status"

  publish:
    needs: [validate-release, build-sign-notarize]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download verified app from this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2; Node 24
        with:
          artifact-ids: ${{ needs.build-sign-notarize.outputs.artifact-id }}
          path: release
          merge-multiple: true
          digest-mismatch: error
      - name: Publish to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ needs.validate-release.outputs.commit }}
        run: |
          set -euo pipefail
          test -s release/Transcriber.zip
          gh release create "$RELEASE_TAG" release/Transcriber.zip \
            --verify-tag --target "$RELEASE_COMMIT" --generate-notes
